            // Load models list
            const loadModels = async () => {
                try {
                    const response = await fetch('/api/models');
                    const data = await response.json();
                    setModels(data.models || []);
                    if (data.models_dir) setModelsDir(data.models_dir);
                } catch (error) {
                    console.error('Error loading models:', error);
                }
            };

            const openModelsFolder = async () => {
                try {
                    await fetch('/api/open_folder', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: modelsDir })
                    });
                } catch (error) {
                    console.error('Error opening folder:', error);
                }
            };

            // Start training
            const startTraining = async (continueTraining = false) => {
                const hiddenLayersArray = hiddenLayers.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));

                if (hiddenLayersArray.length === 0) {
                    alert('有効な隠れ層を入力してください（例: 64,32）');
                    return;
                }

                if (selectedSensors.length === 0) {
                    alert('少なくとも1つのセンサーを選択してください');
                    return;
                }

                if (selectedOutputs.length === 0) {
                    alert('少なくとも1つの出力を選択してください');
                    return;
                }

                const config = {
                    hidden_layers: hiddenLayersArray,
                    epochs: parseInt(epochs),
                    batch_size: parseInt(batchSize),
                    learning_rate: parseFloat(learningRate),
                    deleted_indexes: deletedIndexes,
                    selected_sensors: selectedSensors,
                    selected_outputs: selectedOutputs,
                    use_dropout: useDropout,
                    dropout_rate: parseFloat(dropoutRate),
                    data_range_start: dataRangeStart !== '' ? parseInt(dataRangeStart) : null,
                    data_range_end: dataRangeEnd !== '' ? parseInt(dataRangeEnd) : null,
                    downsample_rate: parseInt(downsampleRate) || 1
                };

                try {
                    const endpoint = continueTraining ? '/api/training/continue' : '/api/training/train';
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                    const data = await response.json();

                    if (data.error) {
                        alert(data.error);
                        return;
                    }

                    setIsTraining(true);
                    setTrainLosses([]);
                    setValLosses([]);
                    addLog(`Training started: ${continueTraining ? 'Continue' : 'New'} model`);

                    // Start progress polling
                    startProgressPolling();
                } catch (error) {
                    console.error('Error starting training:', error);
                    alert('学習の開始に失敗しました');
                }
            };

            // Stop training
            const stopTraining = async () => {
                try {
                    await fetch('/api/training/stop', { method: 'POST' });
                    addLog('Training stop requested');
                } catch (error) {
                    console.error('Error stopping training:', error);
                }
            };

            // Progress polling
            const progressIntervalRef = useRef(null);

            const startProgressPolling = () => {
                if (progressIntervalRef.current) {
                    clearInterval(progressIntervalRef.current);
                }

                progressIntervalRef.current = setInterval(async () => {
                    try {
                        const response = await fetch('/api/training/progress');
                        const progress = await response.json();

                        setTrainingProgress(progress);

                        if (progress.train_losses && progress.train_losses.length > 0) {
                            setTrainLosses(progress.train_losses);
                            setValLosses(progress.val_losses || []);
                            updateLearningCurve(progress.train_losses, progress.val_losses || []);
                        }

                        if (!progress.is_training) {
                            clearInterval(progressIntervalRef.current);
                            setIsTraining(false);
                            addLog('Training completed');
                            loadModels();
                        }
                    } catch (error) {
                        console.error('Error polling progress:', error);
                    }
                }, 2000);
            };

            // Update learning curve with Plotly
            const updateLearningCurve = (trainLosses, valLosses) => {
                if (!learningCurveRef.current) return;

                const traces = [
                    {
                        y: trainLosses,
                        name: 'Train Loss',
                        type: 'scatter',
                        mode: 'lines',
                        line: { color: '#3B82F6' }
                    },
                    {
                        y: valLosses,
                        name: 'Val Loss',
                        type: 'scatter',
                        mode: 'lines',
                        line: { color: '#EF4444' }
                    }
                ];

                const layout = {
                    title: 'Learning Curve',
                    xaxis: { title: 'Epoch' },
                    yaxis: { title: 'Loss' },
                    margin: { t: 40, r: 20, b: 40, l: 50 },
                    legend: { x: 1, y: 1, xanchor: 'right' }
                };

                Plotly.react(learningCurveRef.current, traces, layout, { responsive: true });
            };

            // Load model
            const handleLoadModel = async (model) => {
                try {
                    const response = await fetch('/api/models/load', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model_path: model.path })
                    });
                    const data = await response.json();

                    if (data.error) {
                        alert(data.error);
                        return;
                    }

                    setCurrentModel(data.model_info);
                    addLog(`Model loaded: ${model.filename}`);

                    // Update learning curve with loaded model's losses
                    if (data.train_losses && data.train_losses.length > 0) {
                        setTrainLosses(data.train_losses);
                        setValLosses(data.val_losses || []);
                        updateLearningCurve(data.train_losses, data.val_losses || []);
                    }
                } catch (error) {
                    console.error('Error loading model:', error);
                    alert('モデルの読み込みに失敗しました');
                }
            };

            // Delete model
            const handleDeleteModel = async (model, e) => {
                e.stopPropagation(); // Prevent triggering the load action

                if (!confirm(`Move model "${model.filename}" to trash?`)) {
                    return;
                }

                try {
                    const response = await fetch('/api/models/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ model_path: model.path })
                    });
                    const data = await response.json();

                    if (data.error) {
                        alert(data.error);
                        return;
                    }

                    addLog(`Model moved to trash: ${model.filename}`);

                    // If deleted model was current, clear it
                    if (currentModel?.filename === model.filename) {
                        setCurrentModel(null);
                        setTrainLosses([]);
                        setValLosses([]);
                    }

                    // Reload model list
                    loadModels();
                } catch (error) {
                    console.error('Error deleting model:', error);
                    alert('モデルの削除に失敗しました');
                }
            };

            // Run prediction
            const runPrediction = async () => {
                if (!currentModel) {
                    alert('先にモデルを読み込んでください');
                    return;
                }

                try {
                    addLog('Running prediction...');
                    const response = await fetch('/api/models/predict', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ deleted_indexes: deletedIndexes })
                    });
                    const data = await response.json();

                    if (data.error) {
                        alert(data.error);
                        return;
                    }

                    // Store predictions for chart overlay
                    setPredictions(data.predictions);
                    setShowPredictions(true);

                    addLog(`Prediction completed: ${data.total_predictions} samples`);
                    addLog(`Model: ${data.model_name}`);
                    addLog(`Sensors used: ${data.selected_sensors.join(', ')}`);

                    // Switch to viewer tab and show results
                    setActiveTab('viewer');
                    alert(`${data.total_predictions}件のサンプルで予測が完了しました。\n予測結果がデータビューアのチャートにオーバーレイされました。`);
                } catch (error) {
                    console.error('Error running prediction:', error);
                    alert('予測の実行に失敗しました');
                }
            };

            // Clear predictions overlay
            const clearPredictions = () => {
                setPredictions(null);
                setShowPredictions(false);
                addLog('Predictions cleared');
            };

            // Start MLflow UI
            const startMLflowUI = async () => {
                try {
                    const response = await fetch('/api/mlflow/start', { method: 'POST' });
                    const data = await response.json();
                    addLog(data.message);
                    // Build URL using browser's current hostname (works for both local and remote)
                    const mlflowUrl = `http://${window.location.hostname}:${data.port}`;
                    let retries = 0;
                    const waitForReady = async () => {
                        while (retries < 10) {
                            try {
                                await fetch(mlflowUrl, { mode: 'no-cors' });
                                window.open(mlflowUrl, '_blank');
                                return;
                            } catch {
                                retries++;
                                await new Promise(r => setTimeout(r, 1000));
                            }
                        }
                        addLog('MLflow UIの起動に時間がかかっています。手動でアクセスしてください: ' + mlflowUrl);
                    };
                    waitForReady();
                } catch (error) {
                    console.error('Error starting MLflow:', error);
                }
            };

            // Add log message
            const addLog = (message) => {
                const timestamp = new Date().toLocaleTimeString();
                setTrainingLog(prev => [...prev, `[${timestamp}] ${message}`]);
            };

            // Toggle sensor selection
            const toggleSensor = (sensor) => {
                setSelectedSensors(prev =>
                    prev.includes(sensor)
                        ? prev.filter(s => s !== sensor)
                        : [...prev, sensor]
                );
            };

            // Load sensors and models when switching to training tab
            useEffect(() => {
                if (activeTab === 'training' && dataInfo) {
                    loadSensors();
                    loadModels();
                    updateAvailableOutputs();
                }
            }, [activeTab, dataInfo, records]);

            // Load code sections when switching to code tab, re-fetch when data changes
            const codeFetchedForData = useRef(null);
            useEffect(() => {
                if (activeTab !== 'code') return;
                const dataKey = dataInfo ? dataInfo.total_records : null;
                if (codeSections.length === 0 || codeFetchedForData.current !== dataKey) {
                    fetch('/api/code')
                        .then(res => res.json())
                        .then(data => {
                            if (data.sections) {
                                setCodeSections(data.sections);
                                const expandMap = {};
                                data.sections.forEach((_, i) => { expandMap[i] = false; });
                                setCodeExpandedMap(expandMap);
                                codeFetchedForData.current = dataKey;
                            }
                        })
                        .catch(err => console.error('Failed to load code:', err));
                }
            }, [activeTab, dataInfo]);

            // Apply syntax highlighting when code sections are rendered or expanded
            useEffect(() => {
                if (activeTab === 'code' && codeSections.length > 0) {
                    // Wait for DOM update, then highlight all code blocks
                    requestAnimationFrame(() => {
                        document.querySelectorAll('#code-tab-content pre code').forEach(block => {
                            if (!block.dataset.highlighted) {
                                hljs.highlightElement(block);
                            }
                        });
                    });
                }
            }, [activeTab, codeSections, codeExpandedMap]);

            // AG Grid: initialize or update when data tab is shown
            const dataGridRecordsRef = useRef(null);
            useEffect(() => {
                if (activeTab !== 'data' || records.length === 0 || !dataGridRef.current) return;
                if (dataGridApiRef.current && dataGridRecordsRef.current === records) return;

                const internalKeys = new Set(['_absolute_index', '_display_index', '_index', '_is_deleted', '_session_id', '_timestamp_ms']);
                const allKeys = Object.keys(records[0]);
                const imageKeys = allKeys.filter(k => k.endsWith('/image_array'));
                const dataKeys = allKeys.filter(k => !k.endsWith('/image_array') && !k.endsWith('/distance_array') && !internalKeys.has(k));

                // --- Precompute min/max per column for color scaling ---
                const colStats = {};
                dataKeys.forEach(k => {
                    const vals = records.map(r => r[k]).filter(v => typeof v === 'number');
                    if (vals.length > 0) {
                        colStats[k] = { min: Math.min(...vals), max: Math.max(...vals) };
                    }
                });

                // --- Helpers ---
                // Interpolate color: ratio 0→blue/green, 1→red/orange
                const heatColor = (ratio, alpha = 0.25) => {
                    // 0=green(120°) → 1=red(0°) via HSL
                    const h = (1 - ratio) * 120;
                    return `hsla(${h}, 80%, 45%, ${alpha})`;
                };

                // Bar renderer for user/angle, user/throttle (-1 to 1)
                const barCellRenderer = (params) => {
                    const v = params.value;
                    if (v == null || typeof v !== 'number') return '';
                    const container = document.createElement('div');
                    container.style.cssText = 'position:relative; width:100%; height:100%; display:flex; align-items:center;';

                    // Background bar: center = 0, extends left(negative) or right(positive)
                    const bar = document.createElement('div');
                    const pct = Math.min(Math.abs(v), 1) * 50; // 50% = full scale
                    const left = v >= 0 ? 50 : 50 - pct;
                    const barColor = v >= 0 ? 'rgba(59,130,246,0.3)' : 'rgba(239,68,68,0.3)';
                    bar.style.cssText = `position:absolute; top:2px; bottom:2px; left:${left}%; width:${pct}%; background:${barColor}; border-radius:2px;`;
                    container.appendChild(bar);

                    // Center line
                    const center = document.createElement('div');
                    center.style.cssText = 'position:absolute; top:2px; bottom:2px; left:50%; width:1px; background:rgba(0,0,0,0.15);';
                    container.appendChild(center);

                    // Text
                    const text = document.createElement('span');
                    text.style.cssText = 'position:relative; z-index:1; font-size:0.7rem; font-family:monospace; width:100%; text-align:right;';
                    text.textContent = v.toFixed(2);
                    container.appendChild(text);
                    return container;
                };

                // --- Build column definitions with grouping ---
                // Group keys by prefix (e.g. "ultrasonic/FrFR" → group "ultrasonic")
                const groups = {};
                const ungrouped = [];
                dataKeys.forEach(k => {
                    const slashIdx = k.indexOf('/');
                    if (slashIdx > 0) {
                        const prefix = k.substring(0, slashIdx);
                        if (!groups[prefix]) groups[prefix] = [];
                        groups[prefix].push(k);
                    } else {
                        ungrouped.push(k);
                    }
                });

                // Create a column def for a single data key
                const makeColDef = (k) => {
                    const shortName = k.includes('/') ? k.split('/').pop() : k;
                    const isUserControl = k === 'user/angle' || k === 'user/throttle';
                    const isUltrasonic = k.startsWith('ultrasonic/');
                    const stats = colStats[k];

                    const colDef = {
                        headerName: shortName,
                        field: k,
                        width: isUserControl ? 140 : 100,
                        headerTooltip: k
                    };

                    if (isUserControl) {
                        // Bar + formatted value for angle / throttle
                        colDef.cellRenderer = barCellRenderer;
                    } else {
                        // Standard value formatter with type-aware formatting
                        colDef.valueFormatter = (params) => {
                            const v = params.value;
                            if (v == null) return '';
                            if (typeof v === 'number') {
                                if (Number.isInteger(v)) return String(v);
                                if (isUltrasonic) return v.toFixed(1);
                                return v.toFixed(2);
                            }
                            return String(v);
                        };

                        // Conditional background color for numeric columns
                        if (stats && stats.max > stats.min) {
                            colDef.cellStyle = (params) => {
                                const v = params.value;
                                if (typeof v !== 'number') return null;
                                const ratio = (v - stats.min) / (stats.max - stats.min);
                                return { backgroundColor: heatColor(ratio, 0.18) };
                            };
                        }
                    }
                    return colDef;
                };

                // Assemble: # column + grouped columns + ungrouped + images
                const columnDefs = [
                    { headerName: '#', valueGetter: 'node.rowIndex', width: 55, pinned: 'left', sortable: false, filter: false,
                      cellStyle: { color: '#999', fontSize: '0.7rem' } }
                ];

                // Add grouped columns
                Object.entries(groups).forEach(([prefix, keys]) => {
                    if (keys.length === 1) {
                        columnDefs.push(makeColDef(keys[0]));
                    } else {
                        columnDefs.push({
                            headerName: prefix,
                            children: keys.map(k => makeColDef(k))
                        });
                    }
                });

                // Add ungrouped columns
                ungrouped.forEach(k => columnDefs.push(makeColDef(k)));

                // Add image columns
                imageKeys.forEach(k => {
                    const shortName = k.includes('/') ? k.split('/').pop() : k;
                    columnDefs.push({
                        headerName: shortName,
                        field: k,
                        width: 160,
                        sortable: false,
                        filter: false,
                        headerTooltip: k,
                        cellRenderer: (params) => {
                            if (!params.value) return '';
                            const img = document.createElement('img');
                            img.src = `${API_BASE}/api/image/${params.value}?quality=30`;
                            img.style.cssText = 'height:40px; border-radius:3px; cursor:pointer;';
                            img.title = params.value;
                            img.loading = 'lazy';
                            return img;
                        }
                    });
                });

                const gridOptions = {
                    columnDefs,
                    rowData: records,
                    defaultColDef: {
                        sortable: true,
                        filter: true,
                        resizable: true,
                        suppressMovable: true
                    },
                    rowHeight: imageKeys.length > 0 ? 50 : 28,
                    headerHeight: 28,
                    groupHeaderHeight: 22,
                    animateRows: false,
                    suppressCellFocus: true
                };

                // Destroy previous grid instance
                if (dataGridApiRef.current) {
                    dataGridApiRef.current.destroy();
                    dataGridApiRef.current = null;
                }
                dataGridRef.current.innerHTML = '';

                requestAnimationFrame(() => {
                    if (!dataGridRef.current || activeTab !== 'data') return;
                    dataGridApiRef.current = agGrid.createGrid(dataGridRef.current, gridOptions);
                    dataGridRecordsRef.current = records;
                });

                return () => {
                    if (dataGridApiRef.current) {
                        dataGridApiRef.current.destroy();
                        dataGridApiRef.current = null;
                    }
                };
            }, [activeTab, records]);

            // Cleanup interval on unmount
            useEffect(() => {
                return () => {
                    if (progressIntervalRef.current) {
                        clearInterval(progressIntervalRef.current);
                    }
                };
            }, []);

            return (
                <div className="bg-main" style={{ height: '100vh', overflow: 'hidden' }}>
                    <div className="p-1" style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
                        {/* Folder Selection */}
                        {!selectedFolder && (
                            <div className="bg-panel rounded-lg shadow p-6 mb-6">
                                <h2 className="text-xl font-semibold mb-4">データフォルダを選択</h2>
                                <div className="mb-4">
                                    <button
                                        onClick={() => setShowFileBrowser(true)}
                                        className="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition"
                                    >
                                        📁 フォルダを参照
                                    </button>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                    {folders.map(folder => (
                                        <button
                                            key={folder.path}
                                            onClick={() => loadData(folder.path)}
                                            className="p-4 border rounded-lg hover:bg-blue-50 transition"
                                        >
                                            {folder.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Data Viewer */}
                        {selectedFolder && dataInfo && (
                            <div className="flex flex-col" style={{ height: '100vh', overflow: 'hidden' }}>
                                {/* Tab Navigation */}
                                <div className="tab-container">
                                    <button
                                        onClick={() => setShowFileBrowser(true)}
                                        className="px-2 py-1 bg-gray-500 text-white rounded text-xs hover:bg-gray-600 transition"
                                        style={{ marginRight: '0.25rem', alignSelf: 'center' }}
                                        title="フォルダ選択"
                                    >
                                        📁
                                    </button>
                                    <span className="text-xs text-gray-500" style={{ marginRight: '0.5rem', alignSelf: 'center', maxWidth: '300px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={selectedFolder}>{selectedFolder}</span>
                                    <button
                                        className={`tab-button ${activeTab === 'viewer' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('viewer')}
                                    >
                                        データビューア
                                    </button>
                                    <button
                                        className={`tab-button ${activeTab === 'training' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('training')}
                                    >
                                        学習・モデル管理
                                    </button>
                                    <button
                                        className={`tab-button ${activeTab === 'code' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('code')}
                                    >
                                        コード
                                    </button>
                                    <button
                                        className={`tab-button ${activeTab === 'data' ? 'active' : ''}`}
                                        onClick={() => setActiveTab('data')}
                                    >
                                        データ
                                    </button>
                                </div>

                                {/* Viewer Tab - use display instead of conditional rendering to preserve chart */}
                                <div style={{ display: activeTab === 'viewer' ? 'flex' : 'none', flexDirection: 'column', flex: 1, minHeight: 0, overflow: 'hidden' }}>

                                {/* Main Content */}
                                <div className="flex flex-1 gap-1" style={{ minHeight: 0, overflow: 'hidden' }}>
                                    {/* Images Panel */}
                                    <ResizablePanel
                                        direction="horizontal"
                                        initialSize={imagesPanelWidth}
                                        minSize={200}
                                        maxSize={800}
                                        onResize={setImagesPanelWidth}
                                    >
                                        <div className="bg-panel rounded-lg shadow p-2 h-full flex flex-col" style={{ overflow: 'hidden' }}>
                                            <div className="flex justify-between items-center mb-1" style={{ flexShrink: 0 }}>
                                                <h3 className="text-sm font-semibold">{allLidarKeys.length > 0 ? '画像/LiDAR' : '画像'}</h3>
                                                <details className="relative" style={{ zIndex: 200 }}>
                                                    <summary className="cursor-pointer text-sm text-blue-600 hover:text-blue-800">
                                                        表示選択 ({mediaPanels}/{allImageKeys.length + allLidarKeys.length})
                                                    </summary>
                                                    <div className="absolute right-0 mt-1 w-56 bg-panel border-panel rounded-lg shadow-lg p-2 z-[200] max-h-64 overflow-y-auto" style={{ pointerEvents: 'auto' }}>
                                                        {/* Control buttons */}
                                                        <div className="flex gap-2 mb-2 pb-2 border-b">
                                                            <button
                                                                onClick={showAllMediaKeys}
                                                                className="px-2 py-1 bg-green-500 text-white rounded text-xs hover:bg-green-600"
                                                            >
                                                                全て表示
                                                            </button>
                                                            <button
                                                                onClick={hideAllMediaKeys}
                                                                className="px-2 py-1 bg-red-500 text-white rounded text-xs hover:bg-red-600"
                                                            >
                                                                全て非表示
                                                            </button>
                                                        </div>
                                                        {/* Camera section */}
                                                        {allImageKeys.length > 0 && (
                                                            <div className="text-xs font-semibold text-gray-500 mb-1 mt-1">Camera</div>
                                                        )}
                                                        {allImageKeys.map(key => (
                                                            <label key={key} className="flex items-center p-1 hover:bg-panel-hover cursor-pointer">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={visibleImageKeys[key] || false}
                                                                    onChange={() => toggleImageKeyVisibility(key)}
                                                                    className="mr-2"
                                                                />
                                                                <span className="text-sm">{key}</span>
                                                            </label>
                                                        ))}
                                                        {/* LiDAR section */}
                                                        {allLidarKeys.length > 0 && (
                                                            <div className="text-xs font-semibold text-gray-500 mb-1 mt-2 pt-1 border-t">LiDAR</div>
                                                        )}
                                                        {allLidarKeys.map(key => (
                                                            <label key={key} className="flex items-center p-1 hover:bg-panel-hover cursor-pointer">
                                                                <input
                                                                    type="checkbox"
                                                                    checked={visibleLidarKeys[key] || false}
                                                                    onChange={() => toggleLidarKeyVisibility(key)}
                                                                    className="mr-2"
                                                                />
                                                                <span className="text-sm">{key === '__lidar_zones__' ? 'ゾーン（中央値）' : key}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </details>
                                            </div>
                                            <div
                                                className="image-grid flex-1"
                                                style={{...gridStyle, minHeight: 0}}
                                            >
                                                {imageKeys.map(key => {
                                                    const apiUrl = `${API_BASE}/api/image/${currentRecord[key]}`;
                                                    const cache = imageCacheRef.current;
                                                    const blobUrl = cache.get(apiUrl);
                                                    // LRU touch via ref (no state change in render)
                                                    if (blobUrl) {
                                                        cache.delete(apiUrl);
                                                        cache.set(apiUrl, blobUrl);
                                                    }
                                                    // Use blobURL if cached, otherwise fall back to API URL
                                                    const displayUrl = blobUrl || apiUrl;
                                                    const isInCache = !!blobUrl;
                                                    const requirePreload = playing && playbackSpeed >= 10;

                                                    return (

                                                        borderRadius: '0 0 0.375rem 0.375rem',
                                                        fontSize: '0.75rem',
                                                        lineHeight: '1.5',
                                                        maxHeight: '70vh',
                                                        tabSize: 4
                                                    }}>
                                                        <code className="language-python">{section.code}</code>
                                                    </pre>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* Data Tab */}
                                <div style={{ display: activeTab === 'data' ? 'flex' : 'none', flex: 1, minHeight: 0, overflow: 'hidden', flexDirection: 'column' }}>
                                    {records.length === 0 ? (
                                        <div className="flex items-center justify-center w-full text-gray-400 py-8">データが読み込まれていません</div>
                                    ) : (
                                        <React.Fragment>
                                            <div style={{ padding: '0.25rem 0.5rem', fontSize: '0.7rem', color: 'var(--text-secondary)', borderBottom: '1px solid var(--border-color)', flexShrink: 0 }}>
                                                <span style={{ fontWeight: 600 }}>{selectedFolder}</span>
                                                <span style={{ marginLeft: '1rem' }}>{records.length} レコード</span>
                                            </div>
                                            <div className="ag-theme-alpine" ref={dataGridRef} style={{ flex: 1, width: '100%', minHeight: 0 }}></div>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* File Browser Modal */}
                        {showFileBrowser && (
                            <FileBrowser
                                onSelectFolder={(folderPath) => {
                                    setShowFileBrowser(false);
                                    loadData(folderPath);
                                }}
                                onClose={() => setShowFileBrowser(false)}
                            />
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<DonkeycarViewer />);
        {% endraw %}
    </script>
</body>
</html>
