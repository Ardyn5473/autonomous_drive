    <meta property="og:type" content="website">

    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">

    <title>Data Viewer</title>

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/python.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-alpine.css">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
    <style>
        /* Eye-friendly color palette */
        :root {
            --bg-main: #f5f3ed;
            --bg-panel: #faf9f5;
            --bg-hover: #f0ede4;
            --bg-input: #ffffff;
            --border-color: #e5e1d8;
            --text-primary: #2d2d2d;
            --text-secondary: #5a5a5a;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
        }
        .bg-panel {
            background-color: var(--bg-panel) !important;
        }
        .bg-main {
            background-color: var(--bg-main) !important;
        }
        .hover\:bg-panel-hover:hover {
            background-color: var(--bg-hover) !important;
        }
        .border-panel {
            border-color: var(--border-color) !important;
        }
        .bg-input {
            background-color: var(--bg-input) !important;
        }
        .resize-handle {
            position: absolute;
            background: #3B82F6;
            opacity: 0.7;
            transition: all 0.2s;
            z-index: 100;
            pointer-events: auto;
        }
        .resize-handle:hover, .resize-handle.active {
            opacity: 1;
            background: #2563EB;
        }
        .resize-handle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 1px;
        }
        .resize-handle-h {
            cursor: ew-resize;
            width: 6px;
            top: 0;
            bottom: 0;
            right: -3px;
            border-radius: 3px;
        }
        .resize-handle-h::before {
            width: 2px;
            height: 20px;
        }
        .resize-handle-v {
            cursor: ns-resize;
            height: 8px;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 3px;
        }
        .resize-handle-v::before {
            width: 20px;
            height: 2px;
        }
        .resizable-panel {
            position: relative;
            overflow: visible;
            padding-bottom: 8px;
            z-index: 1;
        }
        .image-grid {
            display: grid;
            gap: 0.25rem;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .compact-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding: 0.5rem;
        }

            position: relative;
            overflow: hidden;
            min-height: 200px;

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                rgba(255, 0, 0, 0.1),

        .btn-primary {

            background-color: var(--bg-panel);

            padding: 0.15rem 0.5rem;

            flex-direction: column;

            flex-shrink: 0;
        }
        .playback-info-bar input[type="range"] { flex:1; min-width:80px; }
        .toolbar-group { display:flex; gap:0.375rem; align-items:center; padding-left:0.5rem; border-left:1px solid var(--border-color); margin-left:0.5rem; }
        .toolbar-group:first-child { padding-left:0; border-left:none; margin-left:0; }
        .delete-dropdown { position:absolute; right:0; top:100%; margin-top:4px; background-color:var(--bg-panel); border:1px solid var(--border-color); border-radius:0.375rem; padding:0.5rem; box-shadow:0 4px 6px rgba(0,0,0,0.1); z-index:200; min-width:max-content; }

<body>
    <div id="root"></div>

    <script type="text/babel">
        {% raw %}
        const { useState, useEffect, useRef, useCallback } = React;

        const API_BASE = '';

        // File Browser component
        function FileBrowser({ onSelectFolder, onClose }) {
            const [currentPath, setCurrentPath] = useState('');
            const [items, setItems] = useState([]);
            const [loading, setLoading] = useState(false);

            const browseDirectory = async (path = '') => {
                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/api/browse?path=${encodeURIComponent(path)}`);
                    const data = await response.json();
                    
                    if (data.error) {
                        console.error('Browse error:', data.error);
                        return;
                    }
                    
                    setCurrentPath(data.current_path);
                    setItems(data.items);
                } catch (error) {
                    console.error('Error browsing directory:', error);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                browseDirectory();
            }, []);

            const handleItemClick = (item) => {
                if (item.is_data_folder) {
                    onSelectFolder(item.path);
                } else if (item.type === 'directory' || item.type === 'parent') {
                    browseDirectory(item.path);
                }
            };

            const getFolderIcon = (item) => {
                if (item.type === 'parent') return '⬆️';
                if (item.is_data_folder) return '📊';
                return '📁';
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" style={{ zIndex: 9999 }}>
                    <div className="bg-panel rounded-lg shadow-xl max-w-full max-h-full" style={{ zIndex: 10000, width: '28rem', overflow: 'auto' }}>
                        <div className="flex items-center justify-between p-4 border-b">
                            <h3 className="text-lg font-semibold">データフォルダを選択</h3>
                            <button
                                onClick={onClose}
                                className="text-gray-500 hover:text-gray-700"
                            >
                                ✕
                            </button>
                        </div>

                        <div className="p-4" style={{ overflow: 'hidden' }}>
                            <p className="text-sm text-gray-600 mb-2" style={{ overflowWrap: 'anywhere', wordBreak: 'break-all', maxWidth: '100%' }}>
                                📍 {currentPath}
                            </p>
                            
                            {loading ? (
                                <div className="flex items-center justify-center py-8">
                                    <div className="text-gray-500">読み込み中...</div>
                                </div>
                            ) : (
                                <div className="file-browser">
                                    {items.map((item, index) => (
                                        <div
                                            key={index}
                                            className={`file-item ${item.is_data_folder ? 'data-folder' : ''}`}
                                            onClick={() => handleItemClick(item)}
                                        >
                                            <span>{getFolderIcon(item)}</span>
                                            <span className="flex-1 truncate">{item.name}</span>
                                            {item.is_data_folder && (
                                                <span className="text-xs text-orange-600">DATA</span>
                                            )}
                                        </div>
                                    ))}
                                    
                                    {items.length === 0 && (
                                        <div className="p-4 text-center text-gray-500">
                                            フォルダが見つかりません
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Resizable panel component
        function ResizablePanel({ children, direction = 'horizontal', initialSize = 50, minSize = 100, maxSize = null, onResize }) {
            const [size, setSize] = useState(initialSize);
            const [isResizing, setIsResizing] = useState(false);
            const panelRef = useRef(null);

            // Update size when initialSize prop changes (for restoring saved state)
            useEffect(() => {
                if (initialSize && initialSize !== size) {
                    setSize(initialSize);
                }
            }, [initialSize]);

            const handleMouseDown = useCallback((e) => {
                setIsResizing(true);
                e.preventDefault();
            }, [direction]);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (!isResizing || !panelRef.current) {
                        return;
                    }

                    const panel = panelRef.current;
                    const container = panel.parentElement;
                    const containerRect = container.getBoundingClientRect();

                    let newSize;
                    if (direction === 'horizontal') {
                        // Calculate new width based on mouse position relative to container start
                        newSize = e.clientX - containerRect.left;
                        // Limit to container width - allow up to 90% for better flexibility
                        const maxWidth = maxSize || containerRect.width * 0.9; // Max 90% of container
                        newSize = Math.min(newSize, maxWidth);
                        newSize = Math.max(newSize, minSize); // Ensure minimum size
                    } else {
                        // For vertical, calculate from container top
                        const panelRect = panel.getBoundingClientRect();
                        newSize = e.clientY - panelRect.top;
                        // Limit to reasonable height range
                        const maxHeight = maxSize || containerRect.height * 0.8;
                        newSize = Math.min(newSize, maxHeight);
                        newSize = Math.max(newSize, minSize);
                    }

                    setSize(newSize);
                    if (onResize) onResize(newSize);
                };

                const handleMouseUp = () => {
                    setIsResizing(false);
                };

                if (isResizing) {
                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                }

                return () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isResizing, direction, minSize, maxSize, onResize]);

            const style = direction === 'horizontal'
                ? { width: `${size}px`, minWidth: `${minSize}px`, flexShrink: 0 }
                : { height: `${size}px`, minHeight: `${minSize}px`, flexShrink: 0 };

            return (
                <div ref={panelRef} className="resizable-panel" style={style}>
                    {children}
                    <div 
                        className={`resize-handle resize-handle-${direction === 'horizontal' ? 'h' : 'v'} ${isResizing ? 'active' : ''}`}
                        onMouseDown={handleMouseDown}
                    />
                </div>
            );
        }

        const ZONE_NAMES = [
            { name: 'RrLH', angle: 270 },
            { name: 'FrLH', angle: 315 },
            { name: 'FrFR', angle: 0 },
            { name: 'FrRH', angle: 45 },
            { name: 'RrRH', angle: 90 },
        ];
        // Build ZONE_CONFIG dynamically from record keys (lidar/, ultrasonic/, etc.)
        function buildZoneConfig(record) {
            const configs = [];
            if (!record) return configs;
            for (const key of Object.keys(record)) {
                const parts = key.split('/');
                if (parts.length !== 2) continue;
                const zone = ZONE_NAMES.find(z => z.name === parts[1]);
                if (!zone) continue;
                const val = parseFloat(record[key]);
                if (isNaN(val)) continue;
                configs.push({ key, name: parts[1], prefix: parts[0], angle: zone.angle });
            }
            return configs;
        }

        // LiDAR polar point cloud canvas component
        function LidarCanvas({ distances, metadata, zones, zoom }) {
            const containerRef = useRef(null);
            const canvasRef = useRef(null);
            const zoomLevel = zoom || 1.0;
            const [canvasSize, setCanvasSize] = useState({ w: 400, h: 300 });
            const stableMaxDistRef = useRef(null);
            const hadDataRef = useRef(false);

            // Resize canvas to match container
            useEffect(() => {
                const container = containerRef.current;
                if (!container) return;
                const ro = new ResizeObserver(entries => {
                    for (const entry of entries) {
                        const { width, height } = entry.contentRect;
                        if (width > 0 && height > 0) {
                            setCanvasSize({ w: Math.round(width), h: Math.round(height) });
                        }
                    }
                });
                ro.observe(container);
                return () => ro.disconnect();
            }, []);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const hasPointCloud = distances && metadata;
                const hasZones = zones && zones.length > 0;
                if (!hasPointCloud && !hasZones) {
                    // Reset stable maxDist when no data (e.g., new dataset load)
                    hadDataRef.current = false;
                    stableMaxDistRef.current = null;
                    return;
                }

                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;

                // Robot at bottom center
                const cx = w / 2;
                const cy = h - 20;

                // Clear
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, w, h);

                // Find max distance for scaling
                let computedMaxDist = 3000;
                if (hasPointCloud) {
                    const pcMax = Math.max(...distances.filter(d => d > 0));
                    if (pcMax > 0) computedMaxDist = pcMax;
                }
                if (hasZones) {
                    const zoneMax = Math.max(...zones.map(z => z.distance));
                    if (zoneMax > computedMaxDist) computedMaxDist = zoneMax;
                }

                // Lock maxDist after first frame to prevent auto-zoom during playback
                if (!hadDataRef.current) {
                    stableMaxDistRef.current = computedMaxDist;
                    hadDataRef.current = true;
                }
                const maxDist = stableMaxDistRef.current || computedMaxDist;

                // Choose adaptive grid step based on maxDist
                const targetRings = 5;
                const rawStep = maxDist / targetRings;
                const niceSteps = [100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000];
                let gridStep = niceSteps[0];
                for (const ns of niceSteps) {
                    if (ns <= rawStep) gridStep = ns;
                    else break;
                }

                // Scale: robot at bottom, use full height upward
                const numRings = Math.ceil(maxDist / gridStep);
                const maxR = h - 40;
                const scale = (maxR / (numRings * gridStep)) * zoomLevel;

                // Draw concentric circle grid
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 0.5;
                for (let i = 1; i <= numRings; i++) {
                    const r = i * gridStep * scale;
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, Math.PI, 0);
                    ctx.stroke();

                    // Distance label (use meters when >= 1000mm)
                    const distMm = i * gridStep;
                    let label;
                    if (distMm >= 1000) {
                        const distM = distMm / 1000;
                        label = (distM % 1 === 0 ? distM.toFixed(0) : distM.toFixed(1)) + 'm';
                    } else {
                        label = distMm + 'mm';
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.font = '13px monospace';
                    ctx.fillText(label, cx + 3, cy - r + 14);
                }

                // Draw crosshair axes
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(cx, 0); ctx.lineTo(cx, cy);
                ctx.moveTo(0, cy); ctx.lineTo(w, cy);
                ctx.stroke();

                // Draw point cloud
                if (hasPointCloud) {
                    const angleStart = metadata.angle_start || 0;
                    const angleEnd = metadata.angle_end || 360;
                    const clockwise = metadata.clockwise !== false;
                    const dataPoints = metadata.data_points || distances.length;
                    const angleRange = angleEnd - angleStart;

                    for (let i = 0; i < distances.length; i++) {
                        const dist = distances[i];
                        if (dist <= 0) continue;

                        let angleDeg = angleStart + (i / dataPoints) * angleRange;
                        if (!clockwise) angleDeg = -angleDeg;

                        const angleRad = (angleDeg - 90) * Math.PI / 180;
                        const r = dist * scale;
                        const x = cx + r * Math.cos(angleRad);
                        const y = cy + r * Math.sin(angleRad);

                        const t = Math.min(dist / maxDist, 1);
                        const red = Math.floor(255 * (1 - t));
                        const green = Math.floor(255 * t);
                        ctx.fillStyle = `rgb(${red},${green},50)`;

                        ctx.beginPath();
                        ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Draw zone sectors
                if (hasZones) {
                    const halfSpan = 22.5 * Math.PI / 180;
                    for (const zone of zones) {
                        const centerRad = (zone.angle - 90) * Math.PI / 180;
                        const startRad = centerRad - halfSpan;
                        const endRad = centerRad + halfSpan;
                        const r = zone.distance * scale;

                        // Color by distance (same gradient as point cloud)
                        const t = Math.min(zone.distance / maxDist, 1);
                        const red = Math.floor(255 * (1 - t));
                        const green = Math.floor(255 * t);

                        // Fill sector
                        ctx.beginPath();
                        ctx.moveTo(cx, cy);
                        ctx.arc(cx, cy, r, startRad, endRad);
                        ctx.closePath();
                        ctx.fillStyle = `rgba(${red},${green},50,0.25)`;
                        ctx.fill();
                        ctx.strokeStyle = `rgba(${red},${green},50,0.7)`;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        // Distance label at fixed radius from robot
                        const labelR = Math.min(maxR * 0.55, 130);
                        const labelX = cx + labelR * Math.cos(centerRad);
                        const labelY = cy + labelR * Math.sin(centerRad);
                        ctx.fillStyle = 'rgba(255,255,255,0.85)';
                        ctx.font = 'bold 13px monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(`${Math.round(zone.distance)}`, labelX, labelY);
                    }
                    ctx.textAlign = 'start';
                    ctx.textBaseline = 'alphabetic';
                }

                // Draw vehicle marker (cyan triangle at center)
                ctx.fillStyle = '#00e5ff';
                ctx.beginPath();
                ctx.moveTo(cx, cy - 8);
                ctx.lineTo(cx - 5, cy + 5);
                ctx.lineTo(cx + 5, cy + 5);
                ctx.closePath();
                ctx.fill();

            }, [distances, metadata, zones, zoomLevel, canvasSize]);

            return (
                <div ref={containerRef} style={{ width: '100%', height: '100%', position: 'relative' }}>
                <canvas
                    ref={canvasRef}
                    width={canvasSize.w}
                    height={canvasSize.h}
                    style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', background: '#0a0a1a', borderRadius: '0.375rem' }}
                />
                </div>
            );
        }

        function DonkeycarViewer() {
            const [folders, setFolders] = useState([]);
            const [selectedFolder, setSelectedFolder] = useState(null);
            const [dataInfo, setDataInfo] = useState(null);
            const [records, setRecords] = useState([]);

            const [statistics, setStatistics] = useState({});

            const [playing, setPlaying] = useState(false);

            const imageCacheRef = useRef(new Map());

            const [visibleLidarKeys, setVisibleLidarKeys] = useState({});
            const [lidarMetadata, setLidarMetadata] = useState(null);
            const lidarCacheRef = useRef(new Map());
            const [currentLidarData, setCurrentLidarData] = useState({});
            const [lidarZoneZoom, setLidarZoneZoom] = useState(1.0);
            const [smoothingOption, setSmoothingOption] = useState('none');
            const [deleteStartIdx, setDeleteStartIdx] = useState('');
            const [deleteEndIdx, setDeleteEndIdx] = useState('');
            const [imageLoadProgress, setImageLoadProgress] = useState({ loaded: 0, total: 0, done: true });
            // Tab state
            const [activeTab, setActiveTab] = useState('viewer'); // 'viewer' | 'training' | 'code' | 'data'
            const [codeSections, setCodeSections] = useState([]);
            const [codeExpandedMap, setCodeExpandedMap] = useState({});
            // Data tab: AG Grid
            const dataGridRef = useRef(null);
            const dataGridApiRef = useRef(null);
            // Training states
            const [availableSensors, setAvailableSensors] = useState([]);
            const [selectedSensors, setSelectedSensors] = useState([]);
            const [availableOutputs, setAvailableOutputs] = useState(['user/angle', 'user/throttle']);
            const [selectedOutputs, setSelectedOutputs] = useState(['user/angle', 'user/throttle']);
            const [hiddenLayers, setHiddenLayers] = useState('64,32');
            const [epochs, setEpochs] = useState(100);
            const [batchSize, setBatchSize] = useState(32);
            const [learningRate, setLearningRate] = useState(0.001);
            const [useDropout, setUseDropout] = useState(true);
            const [dropoutRate, setDropoutRate] = useState(0.2);
            // Dataset range and downsampling
            const [dataRangeStart, setDataRangeStart] = useState('');
            const [dataRangeEnd, setDataRangeEnd] = useState('');
            const [downsampleRate, setDownsampleRate] = useState(1);
            const [isTraining, setIsTraining] = useState(false);
            const [trainingProgress, setTrainingProgress] = useState(null);
            const [trainLosses, setTrainLosses] = useState([]);
            const [valLosses, setValLosses] = useState([]);
            const [models, setModels] = useState([]);
            const [modelsDir, setModelsDir] = useState('');
            const [currentModel, setCurrentModel] = useState(null);
            const [trainingLog, setTrainingLog] = useState([]);
            const [predictions, setPredictions] = useState(null); // Store prediction results for chart overlay
            const [showPredictions, setShowPredictions] = useState(false); // Toggle prediction overlay visibility
            const learningCurveRef = useRef(null);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const chartUpdatePending = useRef(false);
            const lastChartUpdate = useRef(0);
            const preloadingImages = useRef(new Set()); // Track images currently being loaded
            const histogramInstance = useRef(null);
            const preloadGenerationRef = useRef(0); // Generation counter to discard stale preloads
            const platformConfigRef = useRef({
                preload1x: 30, preload5x: 60, preload10x: 80, preload20x: 100,

            });

            // LRU cache eviction: trim to 90% of max when exceeding limit
            // Cache stores Map<apiUrl, blobUrl>
            const evictImageCache = () => {
                const cache = imageCacheRef.current;
                const maxSize = platformConfigRef.current.cacheMaxSize;
                if (cache.size <= maxSize) return;
                const targetSize = Math.floor(maxSize * 0.9);
                const keysToDelete = [];
                for (const key of cache.keys()) {
                    if (cache.size - keysToDelete.length <= targetSize) break;
                    keysToDelete.push(key);
                }
                keysToDelete.forEach(k => {
                    const blobUrl = cache.get(k);
                    if (blobUrl) URL.revokeObjectURL(blobUrl);
                    cache.delete(k);
                });
            };

            // Fetch platform profile on mount
            useEffect(() => {
                fetch(`${API_BASE}/api/platform`)

                            platformConfigRef.current = {

                                maxConcurrentLoads: 20, cacheMaxSize: 500
                            };
                            console.log('[Platform] RPi detected, using reduced buffer config');
                        } else {
                            console.log('[Platform] Desktop detected, using full buffer config');
                        }
                    })
                    .catch(() => {
                        console.log('[Platform] Detection failed, using desktop defaults');
                    });
            }, []);

            // LocalStorage helpers
            const STORAGE_KEY = 'donkeycar_viewer_state';

            const saveState = (state) => {
                try {
                    const currentState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    const newState = { ...currentState, ...state };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(newState));
                } catch (error) {
                    console.error('Error saving state:', error);
                }
            };

            const loadState = () => {
                try {
                    const state = localStorage.getItem(STORAGE_KEY);
                    return state ? JSON.parse(state) : {};
                } catch (error) {
                    console.error('Error loading state:', error);
                    return {};
                }
            };

            // Load folders and saved state on mount
            useEffect(() => {
                loadFolders();

                // Load saved state
                const savedState = loadState();

                // Restore panel sizes
                if (savedState.imagesPanelWidth) {
                    setImagesPanelWidth(savedState.imagesPanelWidth);
                }
                if (savedState.timelineHeight) {
                    setTimelineHeight(savedState.timelineHeight);
                }

                // Auto-load last folder if available
                if (savedState.selectedFolder) {
                    setTimeout(() => {
                        loadData(savedState.selectedFolder);
                    }, 100);
                }
            }, []);

            // Save panel sizes when they change
            useEffect(() => {
                if (imagesPanelWidth > 0) {
                    saveState({ imagesPanelWidth });
                }
            }, [imagesPanelWidth]);

            useEffect(() => {
                if (timelineHeight > 0) {
                    saveState({ timelineHeight });
                }
            }, [timelineHeight]);

            // Save selected folder when it changes
            useEffect(() => {
                if (selectedFolder) {
                    saveState({ selectedFolder });
                }
            }, [selectedFolder]);

            // Save selected data keys when they change
            useEffect(() => {
                if (selectedKeys.length > 0) {
                    saveState({ selectedDataKey: selectedKeys[0] });
                }
            }, [selectedKeys]);

            // Save visible keys (Timeline data selection) when they change
            useEffect(() => {
                if (Object.keys(visibleKeys).length > 0) {
                    saveState({ visibleKeys });
                }
            }, [visibleKeys]);

            // Save visible image keys when they change
            useEffect(() => {
                if (Object.keys(visibleImageKeys).length > 0) {
                    saveState({ visibleImageKeys });
                }
            }, [visibleImageKeys]);

            // Save visible lidar keys when they change
            useEffect(() => {
                if (Object.keys(visibleLidarKeys).length > 0) {
                    saveState({ visibleLidarKeys });
                }
            }, [visibleLidarKeys]);

            // [Removed old auto-play code - replaced with new playback control below]

            const loadFolders = async () => {
                try {
                    // Load from current directory to find data* folders
                    const response = await fetch(`${API_BASE}/api/folders?path=.`);
                    const data = await response.json();
                    setFolders(data.folders || []);
                } catch (error) {
                    console.error('Error loading folders:', error);
                }
            };

            const loadData = async (folderPath) => {
                try {
                    // Stop playback and reset display state immediately
                    setPlaying(false);
                    setRecords([]);
                    setCurrentIndex(0);
                    setSliderIndex(0);
                    setImageLoadProgress({ loaded: 0, total: 0, done: true });

                    // Clear image cache (revoke blob URLs)
                    imageCacheRef.current.forEach(blobUrl => URL.revokeObjectURL(blobUrl));
                    imageCacheRef.current.clear();
                    preloadingImages.current.clear();
                    preloadGenerationRef.current++;

                    // Clear LiDAR cache
                    lidarCacheRef.current.clear();
                    setCurrentLidarData({});
                    setLidarMetadata(null);

                    const response = await fetch(`${API_BASE}/api/load_data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ folder_path: folderPath }),
                    });
                    const result = await response.json();

                    if (result.success) {
                        setDataInfo(result.info);
                        setSelectedFolder(folderPath);
                        setDeletedIndexes(result.info.deleted_indexes || []);

                        // Store LiDAR metadata if available
                        if (result.info.lidar_metadata) {
                            setLidarMetadata(result.info.lidar_metadata);
                        }

                        // Load initial records
                        const loadedRecords = await loadRecords();

                        // Load statistics
                        await loadStatistics();

                        // Reset zoom range
                        setZoomRange({ min: 0, max: null });

                        // Bulk preload all images in background
                        if (loadedRecords.length > 0) {
                            preloadAllImages(loadedRecords);
                        }
                    }
                } catch (error) {
                    console.error('Error loading data:', error);
                }
            };

            const loadRecords = async (start = 0, end = null) => {
                try {
                    let url = `${API_BASE}/api/data?start=${start}`;
                    if (end !== null) {
                        url += `&end=${end}`;
                    }
                    const response = await fetch(url);
                    const data = await response.json();
                    const records = data.records || [];
                    setRecords(records);

                    // Initialize visible image keys - restore saved state or default to all visible
                    if (records.length > 0) {
                        const firstRecord = records[0];
                        const imageKeys = Object.keys(firstRecord).filter(key => key.endsWith('/image_array'));

                        // Try to restore saved image visibility
                        const savedState = loadState();
                        const savedVisibleImageKeys = savedState.visibleImageKeys;

                        const initialImageVisible = {};
                        imageKeys.forEach(key => {
                            // If saved state exists and has this key, use saved value; otherwise default to true
                            if (savedVisibleImageKeys && key in savedVisibleImageKeys) {
                                initialImageVisible[key] = savedVisibleImageKeys[key];
                            } else {
                                initialImageVisible[key] = true;
                            }
                        });
                        setVisibleImageKeys(initialImageVisible);

                        // Initialize visible LiDAR keys
                        const lidarKeys = Object.keys(firstRecord).filter(key => key.endsWith('/distance_array'));
                        const hasZoneKeys = buildZoneConfig(firstRecord).length > 0;
                        if (lidarKeys.length > 0 || hasZoneKeys) {
                            const savedVisibleLidarKeys = savedState.visibleLidarKeys;
                            const initialLidarVisible = {};
                            lidarKeys.forEach(key => {
                                if (savedVisibleLidarKeys && key in savedVisibleLidarKeys) {
                                    initialLidarVisible[key] = savedVisibleLidarKeys[key];
                                } else {
                                    initialLidarVisible[key] = true;
                                }
                            });
                            if (hasZoneKeys) {
                                const zk = '__lidar_zones__';
                                if (savedVisibleLidarKeys && zk in savedVisibleLidarKeys) {
                                    initialLidarVisible[zk] = savedVisibleLidarKeys[zk];
                                } else {
                                    initialLidarVisible[zk] = true;
                                }
                            }
                            setVisibleLidarKeys(initialLidarVisible);
                        } else {
                            setVisibleLidarKeys({});
                        }

                        // Set default delete range: 0 to max index
                        setDeleteStartIdx('0');
                        setDeleteEndIdx((records.length - 1).toString());
                    }
                    return records;
                } catch (error) {
                    console.error('Error loading records:', error);
                    return [];
                }
            };

            const loadStatistics = async () => {
                try {
                    const response = await fetch(`${API_BASE}/api/statistics`);
                    const stats = await response.json();
                    setStatistics(stats);

                    // Restore saved state
                    const savedState = loadState();

                    // Restore visible keys (Timeline data selection) or use defaults
                    if (savedState.visibleKeys) {
                        const restoredVisible = {};
                        Object.keys(stats).forEach(key => {
                            // If saved state has this key, use saved value; otherwise default to false
                            restoredVisible[key] = savedState.visibleKeys[key] || false;
                        });
                        setVisibleKeys(restoredVisible);
                    } else {
                        // Initialize visible keys - default to user/angle and user/throttle
                        const initialVisible = {};
                        Object.keys(stats).forEach(key => {
                            initialVisible[key] = key === 'user/angle' || key === 'user/throttle';
                        });
                        setVisibleKeys(initialVisible);
                    }

                    // Restore saved data key selection for timeline
                    if (savedState.selectedDataKey && Object.keys(stats).includes(savedState.selectedDataKey)) {
                        setSelectedKeys([savedState.selectedDataKey]);
                    }
                } catch (error) {
                    console.error('Error loading statistics:', error);
                }
            };

            // Smoothing functions
            const applySmoothing = (data, option) => {
                if (option === 'none' || data.length === 0) return data;

                // Moving Average
                if (option.startsWith('ma-')) {
                    const windowSize = parseInt(option.split('-')[1]);
                    const smoothed = [];
                    for (let i = 0; i < data.length; i++) {
                        const start = Math.max(0, i - Math.floor(windowSize / 2));
                        const end = Math.min(data.length, i + Math.ceil(windowSize / 2));
                        const window = data.slice(start, end);
                        const sum = window.reduce((acc, val) => acc + val, 0);
                        smoothed.push(sum / window.length);
                    }
                    return smoothed;
                }

                // Exponential Moving Average
                if (option.startsWith('ema-')) {
                    const alpha = parseFloat(option.split('-')[1]);
                    const smoothed = [data[0]];
                    for (let i = 1; i < data.length; i++) {
                        smoothed.push(alpha * data[i] + (1 - alpha) * smoothed[i - 1]);
                    }
                    return smoothed;
                }

                return data;
            };

            const createChart = () => {
                if (!chartRef.current || !records.length) return;

                const ctx = chartRef.current.getContext('2d');

                // Destroy existing chart
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                // Prepare datasets for all visible keys
                const datasets = Object.keys(visibleKeys)
                    .filter(key => visibleKeys[key])
                    .map((key, idx) => {
                        const color = `hsl(${(idx * 360) / Object.keys(visibleKeys).length}, 70%, 50%)`;

                        // Get raw data
                        const rawData = records.map(record => record[key] || 0);

                        // Normalize data if enabled
                        let processedData;
                        if (normalizeData) {
                            const min = Math.min(...rawData);
                            const max = Math.max(...rawData);
                            const range = max - min;
                            processedData = rawData.map(value => {
                                if (range === 0) return 0;
                                return 2 * (value - min) / range - 1;
                            });
                        } else {
                            processedData = rawData;
                        }

                        // Apply smoothing if enabled
                        processedData = applySmoothing(processedData, smoothingOption);

                        return {
                            label: key,
                            data: processedData.map((value, idx) => ({
                                x: idx,
                                y: value
                            })),
                            borderColor: color,
                            backgroundColor: color + '20',
                            borderWidth: 1.5,
                            pointRadius: 0,
                            tension: 0.1
                        };
                    });

                // Add prediction datasets if available and enabled
                if (showPredictions && predictions && predictions.length > 0) {
                    // Define colors for different prediction outputs
                    const predictionColors = {
                        angle: { border: '#FF6B6B', bg: '#FF6B6B20' },
                        throttle: { border: '#4ECDC4', bg: '#4ECDC420' },
                        speed: { border: '#FFD93D', bg: '#FFD93D20' }
                    };

                    // Dynamically add prediction datasets based on available keys
                    const firstPred = predictions[0];
                    const predKeys = Object.keys(firstPred).filter(k => k.startsWith('predicted_'));

                    predKeys.forEach(key => {
                        const outputName = key.replace('predicted_', '');
                        const colors = predictionColors[outputName] || { border: '#9B59B6', bg: '#9B59B620' };
                        const label = `予測 ${outputName}`;

                        const predData = predictions
                            .map(p => ({ x: p._display_index, y: p[key] }));

                        if (predData.length > 0) {
                            datasets.push({
                                label: label,
                                data: predData,
                                borderColor: colors.border,
                                backgroundColor: colors.bg,
                                borderWidth: 2,
                                borderDash: [5, 5],
                                pointRadius: 0,
                                tension: 0.1
                            });
                        }
                    });
                }

                // Create new chart
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: { datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        resizeDelay: 0,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        onClick: (event, elements, chart) => {
                            // Handle click on chart to seek
                            const canvasPosition = Chart.helpers.getRelativePosition(event, chart);
                            const dataX = chart.scales.x.getValueForPixel(canvasPosition.x);
                            const newIndex = Math.round(Math.max(0, Math.min(records.length - 1, dataX)));
                            setCurrentIndex(newIndex);
                        },
                        onZoomComplete: function({chart}) {
                            // Update zoom range when user zooms
                            const xScale = chart.scales.x;
                            setZoomRange({
                                min: Math.round(xScale.min),
                                max: Math.round(xScale.max)
                            });
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'right',
                                labels: {
                                    boxWidth: 12,
                                    padding: 10,
                                    font: {
                                        size: 11
                                    }
                                }
                            },
                            annotation: {
                                annotations: {
                                    timeline: {
                                        type: 'line',
                                        scaleID: 'x',
                                        value: currentIndex,
                                        borderColor: 'rgb(255, 99, 132)',
                                        borderWidth: 3,
                                        borderDash: [5, 5],
                                        label: {
                                            display: true,
                                            content: `Frame ${currentIndex}`,
                                            position: 'start',
                                            backgroundColor: 'rgba(255, 99, 132, 0.8)',
                                            font: {
                                                size: 10
                                            }
                                        }
                                    },
                                    // Add deleted indexes as background boxes (only within visible range for performance)
                                    ...(() => {
                                        // Build a set of display indexes that are marked as deleted
                                        const deletedDisplayIndexes = [];
                                        records.forEach((record, idx) => {
                                            if (record._is_deleted) {
                                                deletedDisplayIndexes.push(idx);
                                            }
                                        });

                                        if (deletedDisplayIndexes.length === 0) return {};

                                        const minRange = zoomRange.min || 0;
                                        const maxRange = zoomRange.max || records.length - 1;

                                        // Merge consecutive deleted indexes into ranges for fewer annotations
                                        const annotations = {};
                                        let rangeStart = null;
                                        let rangeEnd = null;

                                        for (const idx of deletedDisplayIndexes) {
                                            if (idx < minRange || idx > maxRange) continue;
                                            if (rangeStart === null) {
                                                rangeStart = idx;
                                                rangeEnd = idx;
                                            } else if (idx === rangeEnd + 1) {
                                                rangeEnd = idx;
                                            } else {
                                                annotations[`deleted_${rangeStart}_${rangeEnd}`] = {
                                                    type: 'box',
                                                    xMin: rangeStart - 0.4,

            const updateTimelineMarker = () => {
                if (!chartInstance.current) return;

                const now = Date.now();
                const timeSinceLastUpdate = now - lastChartUpdate.current;
                const minUpdateInterval = playbackSpeed >= 10 ? 100 : playbackSpeed >= 5 ? 50 : 16; // 100ms for 10x+, 50ms for 5x+, 16ms (~60fps) otherwise

                if (timeSinceLastUpdate < minUpdateInterval && chartUpdatePending.current) {
                    return; // Skip this update
                }

                if (chartUpdatePending.current) {
                    return; // Already have an update pending
                }

                chartUpdatePending.current = true;
                requestAnimationFrame(() => {
                    if (chartInstance.current) {
                        chartInstance.current.options.plugins.annotation.annotations.timeline.value = currentIndex;
                        chartInstance.current.options.plugins.annotation.annotations.timeline.label.content = `Frame ${currentIndex}`;
                        chartInstance.current.update('none'); // 'none' prevents animations
                        lastChartUpdate.current = Date.now();
                    }
                    chartUpdatePending.current = false;
                });
            };

            // Create combined histogram for user/angle and user/throttle
            const createHistograms = () => {
                if (records.length === 0) return;

                const angleData = records.map(r => r['user/angle']).filter(v => v !== undefined && v !== null);
                const throttleData = records.map(r => r['user/throttle']).filter(v => v !== undefined && v !== null);

                // Fixed range from -1 to 1
                const min = -1;
                const max = 1;
                const bins = 20;
                const binWidth = (max - min) / bins;

                // Create all bin labels from -1 to 1
                const labels = [];
                for (let i = 0; i < bins; i++) {
                    const binStart = min + i * binWidth;
                    labels.push(binStart.toFixed(2));
                }

                const createHistogramData = (data) => {
                    const counts = new Array(bins).fill(0);

                    data.forEach(value => {
                        // Only count values within -1 to 1 range
                        if (value >= min && value <= max) {
                            // Find which bin this value belongs to
                            const binIndex = Math.floor((value - min) / binWidth);
                            // Handle edge case where value === max
                            const safeBinIndex = Math.min(binIndex, bins - 1);
                            counts[safeBinIndex]++;
                        }
                    });

                    return counts;
                };

                // Create histogram data for both
                const angleCounts = createHistogramData(angleData);
                const throttleCounts = createHistogramData(throttleData);

                // Create combined histogram
                const canvas = document.getElementById('histogram');
                if (canvas) {

                                }

                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top',
                                    labels: { font: { size: 10 } }
                                },
                                tooltip: {
                                    callbacks: {
                                        title: function(context) {
                                            const binStart = parseFloat(context[0].label);
                                            const binEnd = binStart + binWidth;
                                            return `Range: ${binStart.toFixed(2)} to ${binEnd.toFixed(2)}`;
                                        }
                                    }
                                }

            // Create chart when data or visible keys change
            useEffect(() => {

            // Create histograms when records change

            // Sync sliderIndex when currentIndex changes (e.g. during playback)
            useEffect(() => {

            // Restart preload from current position when play starts
            const prevPlayingRef = useRef(false);
            useEffect(() => {

            // Playback control - only advance when images are preloaded
            useEffect(() => {
                let interval;
                if (playing && records.length > 0) {
                    // Calculate interval based on speed
                    // Target ~30fps for normal playback
                    const baseInterval = playbackSpeed === 0.5 ? 66 :  // 0.5x: 15fps (slow motion)
                                       playbackSpeed < 1 ? 1000 / (playbackSpeed * 30) :  // Other slow speeds
                                       playbackSpeed === 1 ? 33 :  // Normal speed: ~30fps
                                       playbackSpeed <= 2 ? 33 :   // 2x: 30fps (will skip frames)
                                       playbackSpeed <= 5 ? 50 :   // 5x: 20fps
                                       playbackSpeed <= 10 ? 60 : 80;  // 10x+: 16-12fps

                    interval = setInterval(() => {
                        setCurrentIndex(prev => {
                            const skipAmount = Math.max(1, Math.floor(Number(playbackSpeed)));
                            const next = prev + (skipAmount * playDirection);

                            // Check bounds
                            if (playDirection > 0 && next >= records.length) {
                                setPlaying(false);
                                return records.length - 1;
                            }
                            if (playDirection < 0 && next < 0) {
                                setPlaying(false);
                                return 0;
                            }

                            // Wait for images to be in blob cache before advancing
                            if (next >= 0 && next < records.length) {
                                const nextRecord = records[next];
                                const imageKeys = Object.keys(nextRecord).filter(key => key.endsWith('/image_array'));
                                const allImagesLoaded = imageKeys.every(key => {
                                    const imageUrl = `${API_BASE}/api/image/${nextRecord[key]}`;
                                    return imageCacheRef.current.has(imageUrl);
                                });
                                if (!allImagesLoaded) {
                                    return prev;
                                }
                            }

                            return next;
                        });
                    }, baseInterval);
                }
                return () => clearInterval(interval);
            }, [playing, playbackSpeed, playDirection, records.length, records]);

            // Bulk preload all images via batch API, starting from startIndex
            const PRELOAD_QUALITY = 50;
            const BATCH_SIZE = 50; // images per batch request
            const preloadAllImages = async (loadedRecords, startIndex = 0) => {
                const cache = imageCacheRef.current;
                const gen = preloadGenerationRef.current;

                // Collect {baseUrl, imagePath} per record, preserving record order
                const entriesPerRecord = loadedRecords.map(record =>
                    Object.keys(record)
                        .filter(key => key.endsWith('/image_array'))
                        .map(key => ({
                            baseUrl: `${API_BASE}/api/image/${record[key]}`,
                            imagePath: record[key]
                        }))
                );

                // Reorder: startIndex forward to end, then 0 to startIndex
                const reordered = [];
                for (let i = startIndex; i < entriesPerRecord.length; i++) {
                    reordered.push(...entriesPerRecord[i]);
                }
                for (let i = 0; i < startIndex; i++) {
                    reordered.push(...entriesPerRecord[i]);
                }

                // Filter out already cached (cache key = base URL)
                const entries = reordered.filter(e => !cache.has(e.baseUrl));

                if (entries.length === 0) {
                    setImageLoadProgress({ loaded: 0, total: 0, done: true });
                    return;
                }

                setImageLoadProgress({ loaded: 0, total: entries.length, done: false });
                let loaded = 0;

                // Process via batch API to minimize HTTP overhead
                for (let i = 0; i < entries.length; i += BATCH_SIZE) {
                    if (preloadGenerationRef.current !== gen) break;
                    const batch = entries.slice(i, i + BATCH_SIZE);
                    const paths = batch.map(e => e.imagePath);

                    try {
                        const res = await fetch(`${API_BASE}/api/images_batch`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ paths, quality: PRELOAD_QUALITY })
                        });
                        const data = await res.json();

                        if (preloadGenerationRef.current !== gen) break;

                        if (data.images) {
                            for (const entry of batch) {
                                const b64 = data.images[entry.imagePath];
                                if (b64) {
                                    const binary = atob(b64);
                                    const bytes = new Uint8Array(binary.length);
                                    for (let j = 0; j < binary.length; j++) {
                                        bytes[j] = binary.charCodeAt(j);
                                    }
                                    const blob = new Blob([bytes], { type: 'image/jpeg' });
                                    cache.set(entry.baseUrl, URL.createObjectURL(blob));
                                }
                                loaded++;
                            }
                        } else {
                            loaded += batch.length;
                        }
                    } catch (e) {
                        loaded += batch.length;
                    }
                    setImageLoadProgress({ loaded, total: entries.length, done: loaded >= entries.length });
                }
                setImageLoadProgress(prev => ({ ...prev, done: true }));
            };

            // Restart preload from current position when play starts or slider jumps
            const restartPreloadFrom = (index) => {
                if (records.length === 0) return;
                preloadGenerationRef.current++;
                preloadAllImages(records, index);

            const toggleKeyVisibility = (key) => {

            const hideAllImageKeys = () => {

                Object.keys(visibleImageKeys).forEach(key => {
                    newVisible[key] = false;

                setVisibleImageKeys(newVisible);
            };

            // LiDAR key visibility toggles
            const toggleLidarKeyVisibility = (key) => {

            const showAllLidarKeys = () => {

                setVisibleLidarKeys(newVisible);

            // Combined show/hide all (images + LiDAR)

            const hideAllMediaKeys = () => {
                hideAllImageKeys();
                hideAllLidarKeys();
            };

            // Fetch LiDAR data for a single .npy file (with cache)
            const fetchLidarData = async (npyFilename) => {
                const cache = lidarCacheRef.current;
                if (cache.has(npyFilename)) return cache.get(npyFilename);

                try {
                    const response = await fetch(`${API_BASE}/api/lidar/${npyFilename}`);
                    const data = await response.json();
                    if (data.distances) {
                        cache.set(npyFilename, data.distances);
                        // Evict old entries if cache too large
                        if (cache.size > 200) {
                            const firstKey = cache.keys().next().value;
                            cache.delete(firstKey);
                        }
                        return data.distances;
                    }
                } catch (err) {
                    console.error('Error fetching LiDAR data:', err);
                }
                return null;
            };

            // Load LiDAR data when currentIndex changes
            useEffect(() => {

                const record = records[currentIndex];
                if (!record) return;

                const activeLidarKeys = Object.keys(visibleLidarKeys).filter(k => visibleLidarKeys[k] && k !== '__lidar_zones__');
                if (activeLidarKeys.length === 0) { setCurrentLidarData({}); return; }
                if (!lidarMetadata) return;

                let cancelled = false;

                const loadCurrent = async () => {
                    const newData = {};
                    for (const key of activeLidarKeys) {
                        const npyFile = record[key];
                        if (!npyFile) continue;
                        const distances = await fetchLidarData(npyFile);
                        if (distances && !cancelled) {
                            newData[key] = distances;
                        }
                    }
                    if (!cancelled) setCurrentLidarData(newData);
                };

                loadCurrent();

                // Prefetch next 5 frames
                const prefetchCount = playing ? 5 : 0;
                for (let offset = 1; offset <= prefetchCount; offset++) {
                    const idx = currentIndex + offset * playDirection;
                    if (idx < 0 || idx >= records.length) break;
                    const futureRecord = records[idx];
                    activeLidarKeys.forEach(key => {
                        const npyFile = futureRecord?.[key];
                        if (npyFile && !lidarCacheRef.current.has(npyFile)) {
                            fetchLidarData(npyFile);
                        }
                    });
                }

                return () => { cancelled = true; };
            }, [currentIndex, records, lidarMetadata, visibleLidarKeys, playing, playDirection]);

            // Navigation functions
            const stepForward = () => {

                setPlaying(!playing);
            };

            const setDeleteIndexRange = async () => {

                // Convert currentIndex to _absolute_index
                const startAbsoluteIdx = records[start]?._absolute_index;
                const endAbsoluteIdx = records[end]?._absolute_index;

            const clearDeleteIndexRange = async () => {

            };

            const resetZoom = () => {
                // Reset the range state first
                setZoomRange({ min: 0, max: null });
                
                // Force chart recreation by triggering useEffect
                // This ensures the chart is redrawn with the full range
                setTimeout(() => {

            const applyRange = () => {

            const currentRecord = records[currentIndex] || {};

            const imageKeys = allImageKeys.filter(key => visibleImageKeys[key]);
            const allLidarKeys = Object.keys(visibleLidarKeys);

            const detectedZones = buildZoneConfig(currentRecord);
            const zoneData = detectedZones
                .map(z => ({ name: z.prefix + '/' + z.name, angle: z.angle, distance: parseFloat(currentRecord[z.key]) }))
                .filter(z => !isNaN(z.distance));
            const pointCloudLidarKeys = lidarKeys.filter(k => k !== '__lidar_zones__');
            const showZoneOverlay = visibleLidarKeys['__lidar_zones__'] && zoneData.length > 0;
            const showStandaloneZone = showZoneOverlay && pointCloudLidarKeys.length === 0;

            // Dynamic grid: images flow in columns, LiDAR/zone/record each span full width
            const gridCols = imageKeys.length > 1 ? 2 : 1;
            const imageRows = imageKeys.length > 0 ? Math.ceil(imageKeys.length / gridCols) : 0;
            const fullWidthMediaRows = pointCloudLidarKeys.length + (showStandaloneZone ? 1 : 0);
            const mediaPanels = imageKeys.length + pointCloudLidarKeys.length + (showZoneOverlay ? 1 : 0);
            const totalMediaRows = imageRows + fullWidthMediaRows;
            const gridStyle = {
                gridTemplateColumns: `repeat(${gridCols}, 1fr)`,
                gridTemplateRows: totalMediaRows > 0
                    ? `repeat(${totalMediaRows}, minmax(150px, 1fr)) auto`
                    : 'auto',
            };

            // =====================================================
            // Training Functions
            // =====================================================

            // Load available sensors from data
            const loadSensors = async () => {

                    const data = await response.json();
                    const sensorObjects = data.sensors || [];
                    // Store full objects for display (with type/size info)

                } catch (error) {

            // Update available outputs based on loaded data
            const updateAvailableOutputs = () => {
